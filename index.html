window.google = { script: { run: (function () {
  function mk(ok, no) {
    return new Proxy({}, { get: function (t, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return mk(f, no); };
      if (fn === 'withFailureHandler') return function (f) { return mk(ok, f); };
      return function () {
        const args = Array.prototype.slice.call(arguments);
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: String(fn), args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j && j.ok) { if (ok) ok(j.data === undefined ? null : j.data); } else if (no) no({ message: (j && j.error) || 'Terjadi kesalahan di server.' }); })
          .catch(function () { if (no) no({ message: 'Tidak dapat terhubung ke server. Periksa koneksi internet.' }); });
      };
    } });
  }
  return mk(null, null);
})() } };

  <style>
    :root {
      --primary-emerald: #183E3A;
      --bg-mint: #C6FDC4;
      --card-white: #ffffff;
      --accent-orange: #f59e0b;
      --text-dark: #1e293b;
      --passion-pink: #ec4899;
      --integrity-green: #059669;
      --creativity-brown: #87441A;
      --entre-blue: #0284c7;
    }

    body {
      background-color: var(--bg-mint);
      font-family: 'Poppins', sans-serif;
      color: var(--text-dark);
      padding-bottom: 20px;
      position: relative;
    }

    .swal2-container { z-index: 3000 !important; }

    .nav-top {
      background-color: var(--primary-emerald);
      color: #C6FDC4;
      padding: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-size: 1.3rem;
      position: relative;
      z-index: 10;
    }

    .card {
      border: none;
      border-radius: 25px;
      background: var(--card-white);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      padding: 25px;
      position: relative;
      z-index: 5;
    }

    /* --- AKSEN DAUN --- */
    .leaf-decoration { position: fixed; z-index: -1; pointer-events: none; }
    .leaf-top-left { top: -20px; left: -20px; }
    .leaf-bottom-right { bottom: -40px; right: -40px; }

    .leaf-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
    .falling-leaf { position: absolute; top: -50px; font-size: 20px; opacity: 0.3; animation: fall linear infinite; }
    .falling-leaf:nth-child(1) { left: 10%; animation-duration: 15s; animation-delay: 0s; }
    .falling-leaf:nth-child(2) { left: 50%; animation-duration: 18s; animation-delay: 5s; }
    .falling-leaf:nth-child(3) { left: 80%; animation-duration: 20s; animation-delay: 2s; }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* --- TAGS EMAIL --- */
    .tags-input-container { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; min-height: 50px; align-items: center; transition: 0.3s; }
    .tags-input-container:focus-within { border-color: var(--primary-emerald); box-shadow: 0 0 0 2px rgba(24, 62, 58, 0.1); background: #fff; }
    .tag { background: var(--primary-emerald); color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; font-weight: 500; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .tag span { cursor: pointer; font-weight: 700; opacity: 0.7; line-height: 1; }
    .tag span:hover { opacity: 1; }
    .tags-input-container input { border: none; outline: none; background: transparent; flex: 1; min-width: 150px; font-size: 0.85rem; height: 30px; }

    /* --- TAB & BADGE --- */
    .nav-tabs-custom { display: flex; gap: 8px; margin-bottom: 20px; background: #f1f5f9; padding: 6px; border-radius: 18px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 80px; padding: 10px 5px; border: none; background: transparent; border-radius: 12px; font-weight: 600; font-size: 0.8rem; color: #64748b; transition: 0.3s; }
    .tab-btn.active { background: white; color: var(--primary-emerald); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

    .badge-rutin-premium { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important; color: white !important; border: none !important; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); letter-spacing: 0.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .badge-rutin-premium::before { content: '🔄'; font-size: 0.7rem; }

    @keyframes pulse-status { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .status-ongoing { background: #fff1f2 !important; border: 2px solid #ef4444 !important; }
    .badge-ongoing { background: #ef4444 !important; color: white !important; animation: pulse-status 1.5s infinite; }
    .status-selesai { opacity: 0.6; filter: grayscale(1); background: #f8fafc !important; }
    .badge-selesai { background: #64748b !important; color: white !important; }

    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .judul-sec { font-size: 0.8rem; font-weight: 700; color: var(--primary-emerald); text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 3px solid var(--bg-mint); display: inline-block; padding-bottom: 5px; margin-bottom: 0; }
    .btn-refresh { background: var(--bg-mint); border: none; color: var(--primary-emerald); border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
    .btn-refresh:hover { background: #b2f8af; transform: rotate(90deg); }
    .rotating { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .btn-add { background: var(--primary-emerald); color: #C6FDC4; border: none; border-radius: 30px; padding: 9px 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.25s; box-shadow: 0 4px 12px rgba(24,62,58,0.25); white-space: nowrap; }
    .btn-add:hover { background: #0d2422; transform: translateY(-2px); }

    .form-control, .form-select { border-radius: 12px; padding: 12px; border: 1px solid #e2e8f0; background: #f8fafc; height: 50px; }
    textarea.form-control { height: auto; min-height: 80px; resize: vertical; }
    .btn-save { border-radius: 15px; padding: 15px; font-weight: 700; background-color: var(--primary-emerald); color: white; border: none; width: 100%; transition: 0.3s; margin-top: 10px; }
    .btn-save:hover:not(:disabled) { background-color: #0d2422; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .btn-save:disabled { opacity: 0.7; }

    .item-j { background: #ffffff; border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; border: 1px solid #f1f5f9; transition: 0.2s; position: relative; z-index: 10; }
    .info { flex: 1; min-width: 0; padding-left: 12px; }
    .badge-t { font-size: 0.7rem; padding: 5px 14px; border-radius: 20px; font-weight: 600; margin-bottom: 8px; display: inline-block; text-transform: uppercase; letter-spacing: 0.3px; }
    .room-name { font-weight: 700; font-size: 1.05rem; margin: 0; }
    .user-desc { font-size: 0.85rem; color: #64748b; margin: 0; }
    .jam { font-weight: 700; font-size: 1rem; text-align: right; min-width: 95px; line-height: 1.2; }
    .search-box { border-radius: 30px; border: 2px solid #f1f5f9; padding: 12px 25px; font-size: 0.9rem; width: 100%; margin-bottom: 25px; background: #f8fafc; position: relative; z-index: 10; }
    .page-btn { border-radius: 30px; font-weight: 600; padding: 6px 20px; color: var(--primary-emerald); border: 1px solid var(--primary-emerald); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .footer-service { text-align: center; margin-top: 60px; padding: 30px 15px; border-top: 2px solid rgba(24, 62, 58, 0.05); background: rgba(255, 255, 255, 0.2); position: relative; z-index: 10; }
    .service-title { font-size: 0.7rem; color: #64748b; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 500; }
    .service-name { font-size: 0.9rem; font-weight: 700; color: var(--primary-emerald); display: block; margin-bottom: 2px; }
    .service-contact { font-size: 0.8rem; color: var(--entre-blue); text-decoration: none; font-weight: 500; transition: 0.3s; }

    /* --- MENU UTAMA (atas di desktop, bawah di HP) --- */
    .main-menu { display: flex; justify-content: center; gap: 8px; margin: -10px auto 25px; padding: 0 15px; position: relative; z-index: 10; flex-wrap: wrap; }
    .menu-btn { border: 2px solid var(--primary-emerald); background: rgba(255,255,255,0.6); color: var(--primary-emerald); border-radius: 30px; padding: 10px 24px; font-weight: 600; font-size: 0.85rem; transition: 0.25s; cursor: pointer; }
    .menu-btn.active { background: var(--primary-emerald); color: #C6FDC4; box-shadow: 0 6px 15px rgba(24,62,58,0.25); }

    /* --- STATUS RUANGAN --- */
    .room-status { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
    .rs-card { background: #fff; border-radius: 20px; padding: 14px 16px; border-left: 8px solid var(--c); box-shadow: 0 8px 20px rgba(0,0,0,0.06); cursor: pointer; transition: 0.2s; position: relative; z-index: 5; min-width: 0; }
    .rs-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
    .rs-name { font-weight: 700; font-size: 0.95rem; color: var(--c); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rs-pill { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
    .rs-free { background: #d1fae5; color: #065f46; }
    .rs-busy { background: #ef4444; color: #fff; animation: pulse-status 1.5s infinite; }
    .rs-info { font-size: 0.75rem; color: #64748b; margin: 6px 0 0; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* --- MODAL FORM --- */
    .modal-ov { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-ov.show { display: flex; }
    .modal-box { background: #fff; border-radius: 25px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 24px; position: relative; animation: pop 0.2s ease; }
    @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-x { border: none; background: #f1f5f9; border-radius: 50%; width: 34px; height: 34px; font-size: 1.1rem; line-height: 1; cursor: pointer; color: #475569; }
    .modal-x:hover { background: #e2e8f0; }

    /* --- PILIHAN RUANGAN & DURASI --- */
    .room-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .room-chip { border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 14px; padding: 11px 10px; font-weight: 600; font-size: 0.82rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.15s; text-align: left; }
    .room-chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    .room-chip:hover { border-color: var(--c); }
    .room-chip.active { background: var(--c); border-color: var(--c); color: #fff; }
    .room-chip.active i { background: #fff; }
    .dur-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    .dur-chips small { font-size: 0.7rem; color: #64748b; margin-right: 2px; }
    .dur-chip { border: 1px solid var(--primary-emerald); background: transparent; color: var(--primary-emerald); border-radius: 20px; padding: 3px 12px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .dur-chip:hover { background: var(--bg-mint); }

    /* --- KALENDER EVENT --- */
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .cal-title { font-weight: 700; font-size: 1.15rem; color: var(--primary-emerald); min-width: 160px; text-align: center; }
    .cal-nav-btn { border: none; background: var(--bg-mint); color: var(--primary-emerald); border-radius: 12px; width: 38px; height: 38px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .cal-nav-btn:hover { background: #b2f8af; }
    .cal-today-btn { border: 1px solid var(--primary-emerald); background: transparent; color: var(--primary-emerald); border-radius: 12px; padding: 0 14px; height: 38px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .cal-dow { text-align: center; font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; padding: 6px 0; }
    .cal-cell { min-height: 112px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 5px; cursor: pointer; transition: 0.15s; overflow: hidden; }
    .cal-cell:hover { background: #ecfdf5; border-color: var(--integrity-green); }
    .cal-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-cell.today { border: 2px solid var(--accent-orange); }
    .cal-cell.selected { background: #d1fae5; border-color: var(--primary-emerald); box-shadow: inset 0 0 0 1px var(--primary-emerald); }
    .cal-cell.weekend .cal-num { color: #dc2626; }
    .cal-num { font-size: 0.8rem; font-weight: 700; margin-bottom: 3px; }
    .cal-chips { display: flex; flex-direction: column; gap: 2px; }
    .cal-chip { font-size: 0.66rem; font-weight: 600; border-radius: 6px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-chip.bk { background: #fff !important; color: var(--text-dark) !important; border: 1px solid #e2e8f0; border-left: 4px solid var(--c); }
    .cal-cell.has-ev { position: relative; }
    .cal-cell.has-ev::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--ec); border-radius: 12px 12px 0 0; }
    .cal-chip.evn { border: 0; color: #fff; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .cal-chip.evn::before { content: '◆ '; font-size: .6rem; }
    .lg-item.ev { background: var(--c); border-color: var(--c); color: #fff; font-weight: 600; }
    .lg-item.ev i { background: #fff; transform: rotate(45deg); border-radius: 2px; }
    .lg-item.bkx { cursor: default; border-left: 4px solid #94a3b8; }
    .lamp { color: var(--primary-emerald); font-weight: 600; text-decoration: none; }
    .lamp:hover { text-decoration: underline; }
    .em-item { display: flex; gap: 12px; align-items: stretch; background: #fff; border: 1px solid #e2e8f0; border-left: 6px solid var(--c); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: 0.15s; }
    .em-item:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(15,23,42,.08); }
    .em-date { flex: none; width: 52px; text-align: center; border-radius: 10px; background: var(--c); color: #fff; padding: 6px 0; line-height: 1.1; align-self: flex-start; }
    .em-date b { display: block; font-size: 1.3rem; }
    .em-date small { font-size: 0.65rem; text-transform: uppercase; opacity: .92; }
    .em-body { min-width: 0; flex: 1; }
    .em-title { font-weight: 700; color: #0f172a; margin: 0 0 3px; font-size: 0.93rem; overflow-wrap: anywhere; }
    .em-meta { margin: 0; color: #475569; font-size: 0.78rem; overflow-wrap: anywhere; }
    .em-pill { display: inline-block; margin-top: 7px; font-size: 0.68rem; font-weight: 700; color: #fff; background: var(--c); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
    @media (min-width: 768px) { .cal-chip.evn { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; padding: 3px 6px; font-size: 0.7rem; } }
    @media (max-width: 480px) { .em-date { width: 46px; } }
    .swal2-popup { font-family: 'Poppins', sans-serif !important; border-radius: 22px !important; }
    .swal2-styled.swal2-confirm { background-color: #183E3A !important; border-radius: 12px !important; }
    .swal2-styled.swal2-cancel { border-radius: 12px !important; }
    .swal2-styled:focus { box-shadow: 0 0 0 3px rgba(24,62,58,.25) !important; }
    .cal-more { font-size: 0.65rem; color: #64748b; font-weight: 600; padding-left: 3px; }
    .cal-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 18px; margin: 16px 0 6px; }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.75rem; color: #475569; }
    .lg-item { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #e2e8f0; background: #fff; border-radius: 20px; padding: 4px 11px; cursor: pointer; font-weight: 500; transition: 0.15s; }
    .lg-item i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    .lg-item.off { opacity: 0.4; text-decoration: line-through; }
    .switch-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #475569; cursor: pointer; user-select: none; }
    .switch-wrap input { width: 38px; height: 22px; appearance: none; -webkit-appearance: none; background: #cbd5e1; border-radius: 20px; position: relative; cursor: pointer; transition: 0.2s; }
    .switch-wrap input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: 0.2s; }
    .switch-wrap input:checked { background: var(--primary-emerald); }
    .switch-wrap input:checked::after { left: 18px; }
    .ev-item { background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; border-left: 8px solid var(--primary-emerald); transition: 0.2s; }
    .ev-item:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    .ev-item .ev-title { font-weight: 700; font-size: 0.95rem; margin: 0; }
    .ev-item .ev-meta { font-size: 0.8rem; color: #64748b; margin: 2px 0 0; }
    .ev-tag { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.4px; border-radius: 10px; padding: 1px 8px; background: #f1f5f9; color: #475569; margin-right: 6px; vertical-align: middle; text-transform: uppercase; }

    /* --- RESPONSIVE --- */
    @media (max-width: 991px) {
      .room-status { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }
    @media (max-width: 768px) {
      body { padding-bottom: 90px; }
      .leaf-container, .leaf-decoration { display: none; }
      .main-menu { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; box-shadow: 0 -6px 20px rgba(0,0,0,0.12); border-radius: 22px 22px 0 0; z-index: 1500; flex-wrap: nowrap; gap: 10px; }
      .menu-btn { flex: 1; padding: 11px 6px; font-size: 0.8rem; border-radius: 16px; }
      .modal-ov { align-items: flex-end; padding: 0; }
      .modal-box { border-radius: 25px 25px 0 0; max-width: none; max-height: 92vh; animation: slideUp 0.25s ease; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
      .card { padding: 18px; }
      .nav-top { font-size: 1.1rem; padding: 18px; margin-bottom: 22px; }
    }
    @media (max-width: 576px) {
      .cal-cell { min-height: 58px; padding: 3px; border-radius: 8px; }
      .cal-chips { flex-direction: row; flex-wrap: wrap; gap: 3px; }
      .cal-chip { font-size: 0 !important; width: 8px; height: 8px; padding: 0; border-radius: 50%; border: none !important; }
      .cal-chip.bk { background: var(--c) !important; border-left: none; }
      .cal-chip.evn { width: 11px; height: 11px; border-radius: 3px; }

<script>
  // =====================================================
  // DATA & KONSTANTA
  // =====================================================
  let dataLokal = [];
  let dataFiltered = [];
  let dbUser = [];
  let dataSiap = false;
  let currentPage = 1;
  let currentTab = 'all';
  const itemsPerPage = 5;

  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const HARI_PANJANG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  let DEPT = ['TCR', 'Operation', 'Marcomm', 'Commercial', 'Lainnya'];
  let ROOMS = [
    { key: 'ENTREPRENEURSHIP', name: 'Ruang Entrepreneurship', short: 'Entrepreneurship', color: '#0284c7' },
    { key: 'PASSION',          name: 'Ruang Passion',          short: 'Passion',          color: '#ec4899' },
    { key: 'INTEGRITY',        name: 'Ruang Integrity',        short: 'Integrity',        color: '#059669' },
    { key: 'CREATIVITY',       name: 'Ruang Creativity',       short: 'Creativity',       color: '#87441A' }
  ];
  const KAT_WARNA = { 'Eksternal': '#7c3aed', 'Training / Workshop': '#ea580c', 'Lainnya': '#475569' };   // sengaja beda dari warna ruangan
  const KAT_TEKS  = {};

  // =====================================================
  // HELPER
  // =====================================================
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function menit(s) { const p = String(s || '').split(':'); const v = parseInt(p[0], 10) * 60 + parseInt(p[1], 10); return isNaN(v) ? 0 : v; }
  function menitKeJam(m) { m = Math.max(0, Math.min(1439, m)); return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
  function tglIndo(s) { const p = s.split('-'); return parseInt(p[2], 10) + ' ' + BULAN_S[parseInt(p[1], 10) - 1] + ' ' + p[0]; }
  function hariDariYmd(s) { const p = s.split('-'); return HARI_PANJANG[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
  function getHariIndoJS(d) { return HARI_PANJANG[d.getDay()]; }
  function validateEmail(email) {
    return String(email).toLowerCase().match(/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/);
  }
  function roomOf(nama) {
    const up = String(nama || '').toUpperCase();
    return ROOMS.find(r => up.includes(r.key)) || null;
  }
  function roomColor(nama) { const r = roomOf(nama); return r ? r.color : '#183E3A'; }

  // =====================================================
  // NAVIGASI & MODAL
  // =====================================================
  function showView(v) {
    document.getElementById('view-reservasi').style.display = (v === 'reservasi') ? '' : 'none';
    document.getElementById('view-kalender').style.display = (v === 'kalender') ? '' : 'none';
    document.getElementById('menu-reservasi').classList.toggle('active', v === 'reservasi');
    document.getElementById('menu-kalender').classList.toggle('active', v === 'kalender');
    if (v === 'kalender') renderKalender(); else renderStatusRuangan();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function bukaModal(id) {
    document.getElementById('modal-' + id).classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function tutupModal(id) {
    document.getElementById('modal-' + id).classList.remove('show');
    if (!document.querySelector('.modal-ov.show')) document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.querySelector('.swal2-container')) {
      ['reservasi', 'event'].forEach(tutupModal);
    }
  });

  // =====================================================
  // TAGS EMAIL PESERTA (RESERVASI)
  // =====================================================
  // Input email berbentuk tag: Enter / spasi / koma / titik koma / paste banyak email / pindah kolom
  function buatTagInput(containerId, inputId) {
    const box = document.getElementById(containerId);
    const inp = document.getElementById(inputId);
    let list = [];

    function render() {
      box.querySelectorAll('.tag').forEach(t => t.remove());
      list.forEach((tag, i) => {
        const el = document.createElement('div');
        el.className = 'tag';
        el.appendChild(document.createTextNode(tag + ' '));
        const x = document.createElement('span');
        x.innerHTML = '&times;';
        x.addEventListener('mousedown', ev => { ev.preventDefault(); list.splice(i, 1); render(); });   // mousedown agar tidak kalah dengan blur
        el.appendChild(x);
        box.insertBefore(el, inp);
      });
    }
    function tambah(raw) {
      const sisa = [];
      let berubah = false;
      String(raw).split(/[\s,;]+/).filter(Boolean).forEach(p => {
        p = p.toLowerCase();
        if (validateEmail(p)) { if (!list.includes(p)) { list.push(p); berubah = true; } } else sisa.push(p);
      });
      if (berubah) render();
      return sisa.join(' ');
    }
    function flush() { inp.value = tambah(inp.value); }

    inp.addEventListener('keydown', e => {
      if ([' ', ',', ';', 'Enter'].includes(e.key)) {
        if (inp.value.trim()) { e.preventDefault(); flush(); }
        else if (e.key === 'Enter') e.preventDefault();
      } else if (e.key === 'Backspace' && !inp.value && list.length) {
        list.pop(); render();
      }
    });
    inp.addEventListener('input', () => {
      const v = inp.value;
      if (/[\s,;]/.test(v) || dbUser.some(u => u.email === v.trim())) flush();   // paste banyak email / pilih dari daftar
    });
    inp.addEventListener('blur', flush);
    box.addEventListener('click', () => inp.focus());

    return {
      get: () => list.slice(),
      pending: () => inp.value.trim(),
      flush: flush,
      clear: () => { list = []; inp.value = ''; render(); }
    };
  }
  const tagRes = buatTagInput('tagsContainer', 'email-input');

  // =====================================================
  // INIT & MUAT DATA
  // =====================================================
  function muatDataInit() {
    muatRef();
    muatUser();
    muatData();
    muatEvents();
    setInterval(renderStatusRuangan, 60000);
  }

  function muatRef() {
    renderRoomChips(); renderEvRef();
    google.script.run.withSuccessHandler(d => {
      if (!d) return;
      if (d.rooms && d.rooms.length) { ROOMS = d.rooms.filter(r => r.reservasi !== 'TIDAK'); }
      if (d.dept && d.dept.length) DEPT = d.dept;
      renderRoomChips(); renderEvRef(); renderStatusRuangan();
    }).getRefData();
  }

  function renderEvRef() {
    const sel = document.getElementById('ev-dept'), cur = sel.value;
    sel.innerHTML = '<option value="">Pilih departemen *</option>' + DEPT.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    if (cur && DEPT.indexOf(cur) > -1) sel.value = cur;
  }

  function muatUser() {
    google.script.run.withSuccessHandler(users => {
      dbUser = users || [];
      let htmlEmail = '', htmlNama = '';
      const namaUnik = [...new Set(dbUser.map(u => u.nama))];
      dbUser.forEach(u => { htmlEmail += `<option value="${esc(u.email)}">`; });
      namaUnik.forEach(n => { htmlNama += `<option value="${esc(n)}">`; });
      document.getElementById('listEmail').innerHTML = htmlEmail;
      document.getElementById('listNama').innerHTML = htmlNama;
    }).getUsersFromSheet();
  }

  function setelahDataJadwal(data) {
    dataLokal = data || [];
    dataSiap = true;
    filterJadwal();
    renderStatusRuangan();
    renderKalender();
  }

  function muatData() {
    google.script.run.withSuccessHandler(setelahDataJadwal).getSchedule();
  }

  function refreshManual() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('rotating');
    google.script.run.withSuccessHandler(data => {
      setelahDataJadwal(data);
      btn.classList.remove('rotating');
      Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 2000}).fire({ icon: 'success', title: 'Data diperbarui' });
    }).withFailureHandler(() => btn.classList.remove('rotating')).getSchedule();
  }

  // =====================================================
  // STATUS RUANGAN HARI INI
  // =====================================================
  function renderStatusRuangan() {
    const box = document.getElementById('room-status');
    if (!dataSiap) {
      box.innerHTML = ROOMS.map(r => `<div class="rs-card" style="--c:${r.color}"><p class="rs-name">${esc(r.short)}</p><p class="rs-info">Memuat...</p></div>`).join('');
      return;
    }
    const skrg = new Date();
    const now = skrg.getHours() * 60 + skrg.getMinutes();
    const today = ymd(skrg);
    const hari = getHariIndoJS(skrg);

    box.innerHTML = ROOMS.map(r => {
      const items = dataLokal.filter(j => String(j.ruangan || '').toUpperCase().includes(r.key) &&
        (j.tanggal === today || (j.tipe === 'RUTIN' && j.hari === hari)));
      let cur = null, next = null;
      items.forEach(j => {
        const s = menit(j.mulai), e = menit(j.selesai);
        if (s <= now && now < e) cur = j;
        else if (s > now && (!next || s < menit(next.mulai))) next = j;
      });
      let pill, info;
      if (cur) {
        pill = '<span class="rs-pill rs-busy">Terpakai</span>';
        info = `s/d ${esc(cur.selesai)} • ${esc(cur.nama)}`;
      } else if (next) {
        pill = '<span class="rs-pill rs-free">Kosong</span>';
        info = `Berikutnya ${esc(next.mulai)} • ${esc(next.nama)}`;
      } else {
        pill = '<span class="rs-pill rs-free">Kosong</span>';
        info = 'Kosong sampai hari ini selesai';
      }
      return `<div class="rs-card" style="--c:${r.color}" onclick="bukaReservasi('${esc(r.name)}')" title="Klik untuk reservasi ${esc(r.short)}">
        <p class="rs-name">${esc(r.short)}</p>${pill}<p class="rs-info">${info}</p></div>`;
    }).join('');
  }

  // =====================================================
  // DASHBOARD JADWAL
  // =====================================================
  function setTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = tab;
    currentPage = 1;
    filterJadwal();
  }

  function filterJadwal() {
    const kw = document.getElementById('inputCari').value.toLowerCase();
    const skrg = new Date();
    const tglHariIni = ymd(skrg);
    const hariIndo = getHariIndoJS(skrg);

    let filtered = dataLokal.filter(j => {
      const matchSearch = String(j.nama).toLowerCase().includes(kw) || String(j.ruangan).toLowerCase().includes(kw) || String(j.keperluan).toLowerCase().includes(kw);
      if (!matchSearch) return false;
      if (currentTab === 'today') return j.tanggal === tglHariIni || (j.tipe === 'RUTIN' && j.hari === hariIndo);
      if (currentTab === 'future') return j.tanggal > tglHariIni && j.tipe !== 'RUTIN';
      if (currentTab === 'rutin') return j.tipe === 'RUTIN';
      return (j.tipe === 'RUTIN') ? true : j.tanggal >= tglHariIni;
    });

    filtered.sort((a, b) => {
      const bobot = { 'ONGOING': 1, 'FUTURE': 2, 'SELESAI': 3 };
      if (bobot[a.statusWaktu] !== bobot[b.statusWaktu]) return bobot[a.statusWaktu] - bobot[b.statusWaktu];
      if (a.tanggal === b.tanggal) return a.sortTime - b.sortTime;
      return a.tanggal.localeCompare(b.tanggal);
    });

    dataFiltered = filtered;
    renderHtml();
  }

  function renderHtml() {
    const listDiv = document.getElementById('list');
    const pg = document.getElementById('paginationControl');
    if (dataFiltered.length === 0) {
      listDiv.innerHTML = '<div class="text-center p-5 text-muted small">Tidak ada jadwal ditemukan.</div>';
      pg.style.display = 'none';
      return;
    }
    const totalPages = Math.ceil(dataFiltered.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * itemsPerPage;
    const paginated = dataFiltered.slice(start, start + itemsPerPage);
    let html = '';

    paginated.forEach((j, index) => {
      const isR = j.tipe === 'RUTIN';
      const tglDisplay = isR ? 'SETIAP ' + j.hari : j.hari + ', ' + (j.tanggal.includes('-') ? j.tanggal.split('-').reverse().join('/') : j.tanggal);
      const rColor = roomColor(j.ruangan);

      const s = j.statusWaktu;
      const statusClass = s === 'ONGOING' ? 'status-ongoing' : s === 'SELESAI' ? 'status-selesai' : '';
      const badgeClass = s === 'ONGOING' ? 'badge-ongoing' : s === 'SELESAI' ? 'badge-selesai' : isR ? 'badge-rutin-premium' : '';
      const badgeLabel = s === 'ONGOING' ? '🔴 SEDANG BERLANGSUNG' : s === 'SELESAI' ? '✓ SELESAI' : isR ? 'JADWAL RUTIN' : esc(tglDisplay);
      const badgeStyle = (s === 'ONGOING' || s === 'SELESAI' || isR) ? '' : `background: ${rColor}; color: white;`;
      const warna = s === 'SELESAI' ? '#64748b' : (isR && s !== 'ONGOING' ? 'var(--accent-orange)' : rColor);

      html += `<div class="item-j ${statusClass}" onclick="showDetail(${start + index})" style="cursor:pointer; border-left: 8px solid ${warna}">
          <div class="info">
            <span class="badge-t ${badgeClass}" style="${badgeStyle}">${badgeLabel}</span>
            <p class="room-name" style="color: ${warna}">${esc(j.ruangan)}</p>
            <p class="user-desc"><b>${esc(j.nama)}</b> • ${esc(j.keperluan)}</p>
          </div>
          <div class="jam" style="color: ${warna}">
            ${esc(j.mulai)}<br><span style="font-size:10px; font-weight:400; color:#94a3b8">s/d</span><br>${esc(j.selesai)}
          </div>
        </div>`;
    });

    listDiv.innerHTML = html;
    pg.style.display = 'flex';
    document.getElementById('pageInfo').innerText = `${currentPage} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = (currentPage === 1);
    document.getElementById('btnNext').disabled = (currentPage >= totalPages);
  }

  function nextPage() { currentPage++; renderHtml(); }
  function prevPage() { currentPage--; renderHtml(); }

  function showDetail(index) { showDetailObj(dataFiltered[index]); }

  function showDetailObj(j) {
    if (!j) return;
    const isRutin = j.tipe === 'RUTIN';
    const isSelesai = j.statusWaktu === 'SELESAI';
    Swal.fire({
      title: '<span style="font-size:1.1rem; font-weight:700; color:#183E3A">Detail Reservasi</span>',
      html: `<div style="text-align:left; font-size:0.85rem; background:#f8fafc; padding:18px; border-radius:18px; border:1px solid #e2e8f0; line-height:1.6;">
          <p><strong>📍 Ruangan:</strong><br>${esc(j.ruangan)}</p>
          <p><strong>👤 Pemesan:</strong><br>${esc(j.nama)}</p>
          <p><strong>📝 Agenda:</strong><br>${esc(j.keperluan)}</p>
          <p style="margin-bottom:0;"><strong>📅 Waktu:</strong><br>${esc(j.hari)}, ${esc(j.tanggal)} (${esc(j.mulai)} - ${esc(j.selesai)})</p>
        </div>`,
      showCloseButton: true,
      showConfirmButton: false,
      showCancelButton: true,
      cancelButtonText: 'Tutup'
    });
  }

  // FORM RESERVASI
  // =====================================================
  function renderRoomChips() {
    document.getElementById('room-chips').innerHTML = ROOMS.map(r =>
      `<button type="button" class="room-chip" style="--c:${r.color}" data-room="${esc(r.name)}" onclick="pilihRuangan('${esc(r.name)}')"><i></i>${esc(r.short)}</button>`

  function pilihRuangan(nama) {
    document.getElementById('ruangan').value = nama || '';
    document.querySelectorAll('#room-chips .room-chip').forEach(c => c.classList.toggle('active', c.dataset.room === nama));

  function bukaReservasi(room) {
    const tgl = document.getElementById('tanggal');
    tgl.min = ymd(new Date());
    if (!tgl.value) tgl.value = ymd(new Date());
    if (room) pilihRuangan(room);

  function isiEmailPemesan() {
    const nama = document.getElementById('nama').value.trim().toLowerCase();
    const el = document.getElementById('email-pemesan');
    if (!nama || el.value) return;
    const m = dbUser.find(u => String(u.nama).toLowerCase() === nama);
    if (m) el.value = String(m.email).split(',')[0].trim();
  }

  // Isi jam selesai otomatis dari jam mulai + durasi (p: 'res' atau 'ev')
  function setDurasi(p, mnt) {
    const mi = document.getElementById(p === 'res' ? 'mulai' : 'ev-mulai');
    const se = document.getElementById(p === 'res' ? 'selesai' : 'ev-selesai');
    if (!mi.value) mi.value = '09:00';
    se.value = menitKeJam(menit(mi.value) + mnt);
  }

  function simpan() {
    const btn = document.getElementById('btn');
    tagRes.flush();
    const f = {
      nama: document.getElementById('nama').value.trim(),
      email: document.getElementById('email-pemesan').value.trim(),
      peserta: tagRes.get().join(','),
      ruangan: document.getElementById('ruangan').value,
      tanggal: document.getElementById('tanggal').value,
      mulai: document.getElementById('mulai').value,
      selesai: document.getElementById('selesai').value,
      keperluan: document.getElementById('keperluan').value.trim(),
      pakaiKalender: document.getElementById('kirimKalender').checked
    };
    if (tagRes.pending()) {
      return Swal.fire({ icon: 'warning', title: 'Email Peserta Tidak Valid', text: 'Periksa kembali: ' + tagRes.pending() });
    }
    if (!f.nama || !f.ruangan || !f.tanggal || !f.mulai || !f.selesai || !f.keperluan || !validateEmail(f.email)) {
      return Swal.fire({ icon: 'warning', title: 'Data Belum Lengkap', text: 'Mohon isi semua kolom wajib, termasuk ruangan dan Email Pemesan yang valid.' });
    }
    if (f.selesai <= f.mulai) return Swal.fire('Waktu Salah', 'Jam selesai harus lebih besar dari jam mulai.', 'error');

    btn.disabled = true; btn.innerText = 'MEMERIKSA JADWAL...';
    google.script.run.withSuccessHandler(res => {
      btn.disabled = false; btn.innerText = 'SIMPAN JADWAL';
      if (res.status === 'SUKSES') {
        Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Reservasi ruangan telah disimpan.', timer: 2500, showConfirmButton: false });
        document.getElementById('formB').reset();
        pilihRuangan('');
        tagRes.clear();
        tutupModal('reservasi');
        muatData();
      } else if (res.status === 'BENTROK') {
        Swal.fire({ icon: 'error', title: 'Jadwal Bentrok!', html: `<div style="text-align:left; font-size:0.85rem; padding:15px; background:#fff5f5; border-radius:15px; border:1px solid #feb2b2;"><b>Oleh:</b> ${esc(res.detail.nama)}<br><b>Agenda:</b> ${esc(res.detail.keperluan)}<br><b>Waktu:</b> ${esc(res.detail.mulai)} - ${esc(res.detail.selesai)}</div>` });
      } else {
        Swal.fire('Gagal', res.msg || 'Terjadi kesalahan.', 'error');
      }
    }).withFailureHandler(err => {
      btn.disabled = false; btn.innerText = 'SIMPAN JADWAL';
      Swal.fire('Gagal', String(err), 'error');
    }).simpanBooking(f);
  }

  // =====================================================
  // KALENDER EVENT
  // =====================================================
  let eventsData = [];
  const _now = new Date();
  let calYear = _now.getFullYear();
  let calMonth = _now.getMonth();
  let calSelected = ymd(_now);
  const katTersembunyi = new Set();

  function warnaEvent(e) { return e.kind === 'booking' ? roomColor(e.lokasi) : (KAT_WARNA[e.kategori] || KAT_WARNA['Lainnya']); }

  function muatEvents() {
    google.script.run.withSuccessHandler(data => {
      eventsData = data || [];
      renderKalender();
    }).getEvents();
  }

  function refreshEvents() {
    const btn = document.getElementById('btn-refresh-ev');
    btn.classList.add('rotating');
    let selesai = 0;
    const beres = () => {
      if (++selesai < 2) return;
      btn.classList.remove('rotating');
      renderKalender();
      Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 2000}).fire({ icon: 'success', title: 'Event order diperbarui' });
    };
    google.script.run.withSuccessHandler(d => { eventsData = d || []; beres(); }).withFailureHandler(beres).getEvents();
    google.script.run.withSuccessHandler(d => { dataLokal = d || []; dataSiap = true; filterJadwal(); renderStatusRuangan(); beres(); }).withFailureHandler(beres).getSchedule();
  }

  function gantiBulan(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderKalender();
  }

  function keHariIni() {
    const n = new Date();
    calYear = n.getFullYear(); calMonth = n.getMonth(); calSelected = ymd(n);
    renderKalender();
  }

  function toggleKat(k) {
    if (katTersembunyi.has(k)) katTersembunyi.delete(k); else katTersembunyi.add(k);
    renderKalender();
  }

  // Hanya event order (reservasi ruangan tidak ditampilkan di sini), setelah filter kategori
  function semuaItemKalender() {
    let list = eventsData.filter(e => !katTersembunyi.has(e.kategori)).map(e => Object.assign({ kind: 'event' }, e));
    return list;
  }

  function itemPadaTanggal(all, ds) {
    return all.filter(e => e.tanggal <= ds && e.tanggalSelesai >= ds).sort((a, b) => {
      if (a.seharian !== b.seharian) return a.seharian ? -1 : 1;
      return (a.mulai || '').localeCompare(b.mulai || '');
    });
  }

  function labelWaktu(e) {
    const rentang = e.tanggal === e.tanggalSelesai ? tglIndo(e.tanggal) : tglIndo(e.tanggal) + ' – ' + tglIndo(e.tanggalSelesai);
    const jam = e.seharian ? 'Seharian penuh' : e.mulai + ' - ' + e.selesai;
    return { rentang, jam };
  }

  function chipHtml(e) {
    const w = warnaEvent(e);
    const teks = (e.seharian ? '' : e.mulai + ' ') + (e.kind === 'booking' ? (roomOf(e.lokasi) ? roomOf(e.lokasi).short + ': ' : '') : '') + e.judul;
    if (e.kind === 'booking') return `<div class="cal-chip bk" style="--c:${w}" title="${esc(e.lokasi)} - ${esc(e.judul)}">${esc(teks)}</div>`;
    return `<div class="cal-chip evn" style="background:${w}" title="Event: ${esc(e.judul)}">${esc(teks)}</div>`;
  }

  function renderLegend() {
    const kats = Object.keys(KAT_WARNA).map(k =>
      `<span class="lg-item ev ${katTersembunyi.has(k) ? 'off' : ''}" style="--c:${KAT_WARNA[k]}" onclick="toggleKat('${esc(k)}')" title="Klik untuk tampil/sembunyikan"><i></i>${esc(k)}</span>`).join('');
    document.getElementById('cal-legend').innerHTML = kats;
  }

  function renderKalender() {
    document.getElementById('cal-title').innerText = BULAN[calMonth] + ' ' + calYear;
    document.getElementById('cal-dow').innerHTML = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(h => `<div class="cal-dow">${h}</div>`).join('');
    renderLegend();

    const all = semuaItemKalender();
    const offset = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // minggu mulai Senin
    const jmlHari = new Date(calYear, calMonth + 1, 0).getDate();
    const hariIni = ymd(new Date());
    let html = '';
    for (let i = 0; i < offset; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= jmlHari; d++) {
      const ds = calYear + '-' + pad2(calMonth + 1) + '-' + pad2(d);
      const evs = itemPadaTanggal(all, ds);
      const ev1 = evs.find(x => x.kind === 'event');
      const dow = (offset + d - 1) % 7;
      const cls = ['cal-cell', ds === hariIni ? 'today' : '', ds === calSelected ? 'selected' : '', dow >= 5 ? 'weekend' : '', ev1 ? 'has-ev' : ''].join(' ');
      const chips = evs.slice().sort((a, b) => (a.kind === 'event' ? 0 : 1) - (b.kind === 'event' ? 0 : 1)).slice(0, 3).map(chipHtml).join('');
      const extra = evs.length > 3 ? `<div class="cal-more">+${evs.length - 3} lagi</div>` : '';
      html += `<div class="${cls}" style="--ec:${ev1 ? warnaEvent(ev1) : 'transparent'}" onclick="pilihTanggal('${ds}')"><div class="cal-num">${d}</div><div class="cal-chips">${chips}</div>${extra}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
    renderAgendaHari(all);
    renderEventBulanIni(all);
  }

  function pilihTanggal(ds) {
    calSelected = ds;
    renderKalender();
    if (window.innerWidth < 768) document.getElementById('cal-day-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Daftar event order satu bulan penuh: judul, jam, PIC, departemen, lokasi terbaca jelas (terutama di HP)
  function renderEventBulanIni(all) {
    const box = document.getElementById('cal-month-list');
    const awal = calYear + '-' + pad2(calMonth + 1) + '-01';
    const akhir = calYear + '-' + pad2(calMonth + 1) + '-' + pad2(new Date(calYear, calMonth + 1, 0).getDate());
    const list = all.filter(e => e.tanggal <= akhir && e.tanggalSelesai >= awal)
      .sort((a, b) => a.tanggal.localeCompare(b.tanggal) || (a.mulai || '').localeCompare(b.mulai || ''));
    document.getElementById('cal-month-title').innerText = 'Event Order ' + BULAN[calMonth] + ' ' + calYear + (list.length ? ' (' + list.length + ')' : '');
    if (!list.length) { box.innerHTML = '<div class="text-center p-4 text-muted small">Belum ada event order di bulan ini.</div>'; return; }
    box.innerHTML = list.map(e => {
      const w = labelWaktu(e), warna = warnaEvent(e), p = e.tanggal.split('-');
      return `<div class="em-item" style="--c:${warna}" onclick="detailItem('event','${esc(e.id)}')">
        <div class="em-date"><b>${parseInt(p[2], 10)}</b><small>${BULAN_S[parseInt(p[1], 10) - 1]}</small></div>
        <div class="em-body">
          <p class="em-title">${esc(e.judul)}</p>
          <p class="em-meta">⏰ ${esc(w.jam)}${e.tanggal !== e.tanggalSelesai ? ' • s/d ' + esc(tglIndo(e.tanggalSelesai)) : ''}</p>
          <p class="em-meta">👤 ${esc(e.pic)}${e.departemen ? ' • ' + esc(e.departemen) : ''}${e.lokasi ? ' • 📍 ' + esc(e.lokasi) : ''}${(e.lampiran || []).length ? ' • 📎 ' + e.lampiran.length : ''}</p>
          <span class="em-pill">${esc(e.kategori)}</span>
        </div>
      </div>`;
    }).join('');
  }

  function renderAgendaHari(all) {
    const evs = itemPadaTanggal(all || semuaItemKalender(), calSelected);
    const p = calSelected.split('-');
    document.getElementById('cal-day-title').innerText = 'Event Order ' + hariDariYmd(calSelected) + ', ' + parseInt(p[2], 10) + ' ' + BULAN[parseInt(p[1], 10) - 1] + ' ' + p[0];
    const box = document.getElementById('cal-day-list');
    if (!evs.length) { box.innerHTML = '<div class="text-center p-4 text-muted small">Belum ada event order di tanggal ini.</div>'; return; }
    box.innerHTML = evs.map(e => {
      const w = labelWaktu(e);
      const warna = warnaEvent(e);
      if (e.kind === 'booking') {
        return `<div class="ev-item" style="border-left-color:${warna}" onclick="detailItem('booking','${e.row}')">
          <p class="ev-title"><span class="ev-tag">Reservasi</span>${esc(e.judul)}</p>
          <p class="ev-meta">⏰ ${esc(w.jam)} • 📍 <span style="color:${warna}; font-weight:600;">${esc(e.lokasi)}</span></p>
          <p class="ev-meta">👤 <b>${esc(e.pic)}</b></p>
        </div>`;
      }
      return `<div class="ev-item" style="border-left-color:${warna}; background:${warna}14" onclick="detailItem('event','${esc(e.id)}')">
        <p class="ev-title"><span class="ev-tag" style="background:${warna}; color:#fff">Event</span>${esc(e.judul)}</p>
        <p class="ev-meta">⏰ ${esc(w.jam)}${e.tanggal !== e.tanggalSelesai ? ' • ' + esc(w.rentang) : ''}</p>
        <p class="ev-meta">👤 <b>${esc(e.pic)}</b>${e.lokasi ? ' • 📍 ' + esc(e.lokasi) : ''} • <span style="color:${warna}; font-weight:600;">${esc(e.kategori)}</span>${(e.lampiran || []).length ? ' • 📎 ' + e.lampiran.length + ' lampiran' : ''}</p>
      </div>`;
    }).join('');
  }

  function detailItem(kind, id) {
    if (kind === 'booking') {
      showDetailObj(dataLokal.find(j => String(j.row) === String(id)));
    } else {
      detailEvent(id);
    }
  }

  // ---------- Form event ----------
  function bukaEvent(tgl) {
    const el = document.getElementById('ev-tgl');
    el.min = ymd(new Date());
    const target = tgl || el.value || calSelected;
    el.value = target < el.min ? el.min : target;
    sinkronTglSelesai(true);
    bukaModal('event');
  }

  function sinkronTglSelesai(force) {
    const a = document.getElementById('ev-tgl').value;
    const b = document.getElementById('ev-tgl-selesai');
    if (force === true || !b.value || b.value < a) b.value = a;
    b.min = a;
  }

  function toggleSeharian() {
    document.getElementById('ev-jam-wrap').style.display = document.getElementById('ev-seharian').checked ? 'none' : '';
  }

  function bacaFiles(inp) {
    const files = Array.from(inp.files || []);
    if (files.length > 3) return Promise.reject('Maksimal 3 file.');
    return Promise.all(files.map(f => new Promise((res, rej) => {
      if (f.size > 5 * 1024 * 1024) return rej('File "' + f.name + '" melebihi 5 MB.');
      const r = new FileReader();
      r.onload = () => res({ name: f.name, type: f.type, data: String(r.result).split(',')[1] });
      r.onerror = () => rej('Gagal membaca file.');
      r.readAsDataURL(f);
    })));
  }

  function simpanEventUI() {
    const btn = document.getElementById('btn-event');
    const f = {
      pic: document.getElementById('ev-pic').value.trim(),
      departemen: document.getElementById('ev-dept').value.trim(),
      judul: document.getElementById('ev-judul').value.trim(),
      kategori: document.getElementById('ev-kategori').value,
      tanggal: document.getElementById('ev-tgl').value,
      tanggalSelesai: document.getElementById('ev-tgl-selesai').value || document.getElementById('ev-tgl').value,
      seharian: document.getElementById('ev-seharian').checked,
      mulai: document.getElementById('ev-mulai').value,
      selesai: document.getElementById('ev-selesai').value,
      lokasi: document.getElementById('ev-lokasi').value,
      keterangan: document.getElementById('ev-ket').value.trim()
    };
    if (!f.pic || !f.departemen || !f.judul || !f.tanggal || (!f.seharian && (!f.mulai || !f.selesai))) {
      return Swal.fire({ icon: 'warning', title: 'Data Belum Lengkap', text: 'Mohon isi PIC, departemen, judul event, tanggal' + (f.seharian ? '.' : ', dan jam.') });
    }
    if (f.tanggalSelesai < f.tanggal) return Swal.fire('Tanggal Salah', 'Tanggal selesai tidak boleh sebelum tanggal mulai.', 'error');
    if (!f.seharian && f.tanggal === f.tanggalSelesai && f.selesai <= f.mulai) return Swal.fire('Waktu Salah', 'Jam selesai harus lebih besar dari jam mulai.', 'error');

    btn.disabled = true; btn.innerText = 'MENYIMPAN...';
    const reset = () => { btn.disabled = false; btn.innerText = 'SIMPAN EVENT ORDER'; };
    bacaFiles(document.getElementById('ev-files')).then(files => {
      f.files = files;
      google.script.run.withSuccessHandler(res => {
        reset();
        if (res.status === 'SUKSES') {
          Swal.fire(res.lampiranGagal ? { icon: 'warning', title: 'Event tersimpan, lampiran gagal', text: res.lampiranGagal } : { icon: 'success', title: 'Event Order Tersimpan!', text: res.kalender ? 'Event sudah masuk ke Google Kalender.' : 'Tersimpan, namun gagal menambahkan ke Google Kalender.', timer: 2500, showConfirmButton: false });
          document.getElementById('formEvent').reset();
          toggleSeharian();
          tutupModal('event');
          const t = f.tanggal.split('-');
          calYear = +t[0]; calMonth = +t[1] - 1; calSelected = f.tanggal;
          muatEvents();
        } else {
          Swal.fire('Gagal', res.msg || 'Terjadi kesalahan.', 'error');
        }
      }).withFailureHandler(err => { reset(); Swal.fire('Gagal', String(err), 'error'); }).simpanEvent(f);
    }).catch(msg => { reset(); Swal.fire('Lampiran', String(msg), 'warning'); });
  }

  function fileId(u) { const m = /\/d\/([\w-]+)/.exec(String(u || '')); return m ? m[1] : ''; }

  // Pratinjau lampiran (PDF, gambar, Office) di dalam aplikasi lewat Google Drive Viewer, tanpa unduh
  function bukaLampiran(evId, i) {
    const e = eventsData.find(x => x.id === evId);
    const l = e && e.lampiran[i];
    if (!l) return;
    const id = fileId(l.url);
    if (!id) { window.open(l.url, '_blank', 'noopener'); return; }
    Swal.fire({
      title: '<span style="font-size:1rem; font-weight:700; color:#183E3A">' + esc(l.nama) + '</span>',
      html: '<iframe src="https://drive.google.com/file/d/' + id + '/preview" style="width:100%; height:68vh; border:0; border-radius:12px; background:#f1f5f9" allow="autoplay"></iframe>' +
            '<div style="margin-top:10px; font-size:.8rem"><a href="' + esc(l.url) + '" target="_blank" rel="noopener">Buka di tab baru</a></div>',
      width: 'min(960px, 95vw)', padding: '1rem', showConfirmButton: false, showCloseButton: true
    }).then(() => detailEvent(evId));
  }

  function detailEvent(id) {
    const e = eventsData.find(x => x.id === id);
    if (!e) return;
    const w = labelWaktu(e);
    Swal.fire({
      title: '<span style="font-size:1.1rem; font-weight:700; color:#183E3A">Detail Event Order</span>',
      html: `<div style="text-align:left; font-size:0.85rem; background:#f8fafc; padding:18px; border-radius:18px; border:1px solid #e2e8f0; line-height:1.6;">
          <p><strong>🎯 Event:</strong><br>${esc(e.judul)}</p>
          <p><strong>🏷️ Kategori:</strong><br><span style="color:${warnaEvent(e)}; font-weight:600;">${esc(e.kategori)}</span></p>
          <p><strong>👤 PIC:</strong><br>${esc(e.pic)}${e.departemen ? ' — ' + esc(e.departemen) : ''}</p>
          <p><strong>📅 Tanggal:</strong><br>${esc(w.rentang)}</p>
          <p><strong>⏰ Waktu:</strong><br>${esc(w.jam)}</p>
          <p><strong>📍 Lokasi:</strong><br>${esc(e.lokasi || '-')}</p>
          ${(e.lampiran || []).length ? '<p><strong>📎 Lampiran:</strong><br>' + e.lampiran.map((l, i) => '<a href="#" class="lamp" onclick="bukaLampiran(\'' + esc(e.id) + '\',' + i + '); return false;">📄 ' + esc(l.nama) + '</a>').join('<br>') + '</p>' : ''}
          <p style="margin-bottom:0;"><strong>📝 Keterangan:</strong><br>${esc(e.keterangan || '-').replace(/\n/g, '<br>')}</p>
        </div>`,
      showCloseButton: true,
      showConfirmButton: false,
      showCancelButton: true,
      cancelButtonText: 'Tutup'
    });
  }
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
</html>
